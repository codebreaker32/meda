# Direction-aware GCN fine-tuned on chips with 10% fully degraded MCs in 2x2 clusters,
# re-drawn every episode, starting from the healthy agent: the protocol of
# paper_30x30_faults10.yaml (Sec. V-B, Fig. 8) applied to the GCN.
base: gnn_dirgcn_30x30.yaml
name: faults10_dirgcn_30x30  # [ASSUMED]
init_from: runs/gnn_dirgcn_30x30/seed_0 # [PAPER Sec. V-B] fault agents start from the healthy agent
env:
  fault_fraction: 0.10       # [PAPER Sec. V-B, Fig. 8] 10% faults
  fault_cluster: 2           # [PAPER Sec. V-B] 2x2 clusters
schedule:
  epochs: 20                 # [PAPER Fig. 8] x-axis; exact count [ASSUMED]
