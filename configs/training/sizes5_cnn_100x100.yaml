# CNN-PPO baseline on healthy 100x100 chips with the five droplet sizes 4x4 to 6x6 of the authors'
# logged run: paper_100x100_healthy.yaml with only the droplet sizes changed. 30x30 counterpart:
# ablate_sizes5_cnn_30x30.yaml. Main experiments keep the paper's nine sizes
# (docs/IMPLEMENTATION_NOTES.md #13).
base: paper_100x100_healthy.yaml
name: sizes5_cnn_100x100      # [ASSUMED]
env:
  jobs:
    droplet_sizes: [[4, 4], [5, 4], [5, 5], [6, 5], [6, 6]] # [REF-CODE] the authors' logged run
schedule:
  epochs: 40                 # [ASSUMED] as in the chip-size study
